<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prism Motion Graphics Runtime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      overflow: hidden;
      background: #000;
      position: relative;
    }
    /* Layer order (bottom to top), matching the old canvas engine's Layer
       1-4 draw order exactly: backdrop+particles, the DOM scene graph
       (camera-transformed), then post-processing (grain/vignette) over
       everything — see MotionRuntime.seek() in runtime.js. */
    #backdropCanvas {
      position: absolute; inset: 0; z-index: 0;
      display: block; image-rendering: -webkit-optimize-contrast;
    }
    #stage {
      position: absolute; inset: 0; z-index: 1;
      transform-origin: 0 0; overflow: visible; /* a panned camera looks past the frame */
    }
    /* Real CSS blending against everything behind (backdrop AND the DOM
       scene graph) — not a canvas, and not per-frame; see
       MotionRuntime._setupPostProcessing() in runtime.js for why a
       transparent overlay canvas using ctx-level "multiply"/"overlay"
       compositing doesn't work here the way it did on the old engine's
       single opaque canvas. */
    #vignetteOverlay {
      position: absolute; inset: 0; z-index: 2;
      mix-blend-mode: multiply; pointer-events: none; display: none;
    }
    #grainOverlay {
      position: absolute; inset: 0; z-index: 3;
      mix-blend-mode: overlay; pointer-events: none; display: none;
    }
  </style>
</head>
<body>
  <canvas id="backdropCanvas" width="1080" height="1920"></canvas>
  <div id="stage"></div>
  <div id="vignetteOverlay"></div>
  <div id="grainOverlay"></div>

  <script src="gsap.min.js"></script>
  <script src="effects.js"></script>
  <script src="runtime.js"></script>
  <script src="transitions.js"></script>
  <script src="primitives.js"></script>
  <script src="domains/charts.js"></script>
  <script src="domains/diagrams.js"></script>
  <script>
    // One canonical bootstrap, used by both the Playwright path
    // (core/motion/render.py) and the Electron path (render_runner.js) —
    // previously the Playwright path reconstructed its own separate
    // MotionRuntime inline instead of using this, and could silently
    // drift from it.
    const backdropCanvas = document.getElementById("backdropCanvas");
    const vignetteOverlay = document.getElementById("vignetteOverlay");
    const grainOverlay = document.getElementById("grainOverlay");
    const stage = document.getElementById("stage");
    const runtime = new MotionRuntime(backdropCanvas, vignetteOverlay, grainOverlay, stage);
    window.__runtime = runtime;
    window.__ready = true;

    window.__loadSpec = function(specJson) {
      const spec = typeof specJson === "string" ? JSON.parse(specJson) : specJson;
      runtime.loadSpec(spec);
      return {
        width: runtime.width,
        height: runtime.height,
        fps: runtime.fps,
        duration: runtime.duration,
        totalFrames: Math.round(runtime.duration * runtime.fps)
      };
    };

    window.__seek = function(frame) {
      runtime.seek(frame);
      return true;
    };

    // 0 once every <img> in the scene graph is .complete (loaded or
    // errored — a capture loop must not hang forever on a broken asset).
    window.__pendingImages = function() {
      return runtime.pendingImageCount();
    };
  </script>
</body>
</html>
